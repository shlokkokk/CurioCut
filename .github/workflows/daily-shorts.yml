name: Daily CurioCut Shorts Auto-Poster

on:
  schedule:
    # Peak Engagement Timings (IST - Indian Standard Time):
    # - Lunch Window: Triggers 12:25 PM IST (06:55 UTC) -> Video goes LIVE at 1:00 PM IST
    # - Prime Evening Surge: Triggers 6:25 PM IST (12:55 UTC) -> Video goes LIVE at 7:00 PM IST
    # (Scheduled at :55 to bypass GitHub's top-of-the-hour :00 congestion queue drops)
    - cron: '55 6,12 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub website anytime!
  repository_dispatch: # Allows external cron triggers (cron-job.org, Cloudflare Workers, webhooks)
    types: [daily_short, tech_short, run_pipeline]

concurrency:
  group: curiocut-gpu-pipeline
  cancel-in-progress: true

jobs:
  dispatch-cloud-gpu-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dispatcher Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Trigger GPU Cloud Engine & Stream Logs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_ENGINE_LOGS: ${{ secrets.DISCORD_WEBHOOK_ENGINE_LOGS }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          DISCORD_WEBHOOK_ERRORS: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
          DISCORD_WEBHOOK_YT_POSTS: ${{ secrets.DISCORD_WEBHOOK_YT_POSTS }}
          DISCORD_WEBHOOK_YT_ERRORS: ${{ secrets.DISCORD_WEBHOOK_YT_ERRORS }}
          DISCORD_WEBHOOK_IG_POSTS: ${{ secrets.DISCORD_WEBHOOK_IG_POSTS }}
          DISCORD_WEBHOOK_IG_ERRORS: ${{ secrets.DISCORD_WEBHOOK_IG_ERRORS }}
          CURIO_SLOT: ${{ github.event.client_payload.slot || 'auto' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python trigger_kaggle.py
