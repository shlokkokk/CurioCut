name: Daily CurioCut Shorts Auto-Poster

on:
  schedule:
    # Runs 2x daily: 7:30 UTC (1:00 PM IST) and 13:30 UTC (7:00 PM IST)
    - cron: '30 7,13 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub website anytime!

jobs:
  dispatch-cloud-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cloud Orchestration Tools
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Dispatch Autonomous Short Generation to Cloud Engine
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python trigger_kaggle.py
