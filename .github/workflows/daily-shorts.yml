name: Daily CurioCut Shorts Auto-Poster

on:
  schedule:
    # Runs 2x daily: 7:30 UTC (1:00 PM IST) and 13:30 UTC (7:00 PM IST)
    - cron: '30 7,13 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub website anytime!

jobs:
  build-render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Chrome Libraries)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libasound2t64 || sudo apt-get install -y ffmpeg libasound2 || true

      - name: Cache AI Voice & Subtitle Models
        id: cache-ai-models
        uses: actions/cache@v4
        with:
          path: |
            ~/.faceless-shorts/kokoro
            ~/.cache/huggingface/hub
          key: ai-models-kokoro-whisper-v2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-download AI Voice & Subtitle Models (if not cached)
        if: steps.cache-ai-models.outputs.cache-hit != 'true'
        run: |
          python faceless-shorts-skill/faceless-shorts/scripts/voice.py --download || true
          python -c "from faster_whisper import WhisperModel; WhisperModel('small.en', device='cpu', compute_type='int8')" || true

      - name: Generate 3D Short & Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DISCORD_WEBHOOK_ENGINE_LOGS: ${{ secrets.DISCORD_WEBHOOK_ENGINE_LOGS }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          DISCORD_WEBHOOK_ERRORS: ${{ secrets.DISCORD_WEBHOOK_ERRORS }}
          DISCORD_WEBHOOK_YT_POSTS: ${{ secrets.DISCORD_WEBHOOK_YT_POSTS }}
          DISCORD_WEBHOOK_YT_ERRORS: ${{ secrets.DISCORD_WEBHOOK_YT_ERRORS }}
          DISCORD_WEBHOOK_IG_POSTS: ${{ secrets.DISCORD_WEBHOOK_IG_POSTS }}
          DISCORD_WEBHOOK_IG_ERRORS: ${{ secrets.DISCORD_WEBHOOK_IG_ERRORS }}
          PYTHONUNBUFFERED: "1"
          FPS: "24"
          SOFTWARE_GL: "1"
          QS: "&aa=1&shadow=1024"
        run: |
          python make_short.py --upload --privacy public

      - name: Upload Output Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curiocut-rendered-shorts
          path: projects/*/renders/*.mp4
          retention-days: 7
