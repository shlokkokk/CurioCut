name = "curiocut-corn"
main = "worker.js"
account_id = "a5c80c80a089714773f34924e13e3f13"
compatibility_date = "2024-11-01"
preview_urls = false

# 3 Daily Upload Slots (0ms Cold-Start Edge Triggers):
# - Slot 1 (1:00 PM IST): Trigger 11:55 AM IST / 06:25 UTC (3D Blender Town-Rule; swap back to classic anytime)
# - Slot 2 (06:30 PM IST): Trigger 04:15 PM IST / 10:45 UTC (3D Claude-Desk - Dodges Kaggle peak surge)
# - Slot 3 (9:30 PM IST): Trigger 08:55 PM IST / 15:25 UTC (3D Dev & Mascot Studio)
[triggers]
crons = [
  "* * * * *",  # Active in IG_LOG_ONLY mode for #dms-sent logging while Zorcha handles IG replies/DMs
  "25 6 * * *",
  "45 10 * * *",
  "55 15 * * *",
  "25 18 * * *"
]

[vars]
IG_LOG_ONLY = "true"  # Set to "false" (or comment "* * * * *") if switching IG DM/reply handling back to Worker

[observability]
enabled = true
[observability.logs]
enabled = true

[[kv_namespaces]]
binding = "REELS_KV"
id = "a32a1654fe9c4bec8393a373ef5bcd75"
